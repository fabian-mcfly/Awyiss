name: PHP checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  phpunit-phpcs:
    name: PHPUnit and PHPCS
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, gd, imagick, intl, libxml, openssl, pdo_sqlite, posix, sqlite3, zip, zlib
          coverage: none
          tools: composer

      - name: Install ImageMagick and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg

          if ! command -v magick >/dev/null 2>&1; then
            sudo ln -s "$(command -v convert)" /usr/local/bin/magick
          fi

          php -m | grep -i '^imagick$'
          magick -version
          ffmpeg -version

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Make Cake CLI executable
        run: chmod +x bin/cake

      - name: Compile Backend SCSS
        run: bin/cake scss compile -r Backend

      - name: Run PHPUnit
        run: composer run test

      - name: Run PHPCS
        run: composer run cs-check
